# One-click deployment for the DetailFlows Next.js mini-apps.
services:
  - type: web
    name: tolg-content-generator
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
